version: "3.9"
services:
  osintdepintel:
    build: .
    image: osintdepintel:latest
    container_name: osintdepintel
    volumes:
      - ./examples:/app/examples:ro
      - ./reports:/app/reports
      - ./tests/fixtures:/app/tests/fixtures:ro
    environment:
      - OSINTDEPINTEL_LOG_LEVEL=${OSINTDEPINTEL_LOG_LEVEL:-INFO}
      - OSINTDEPINTEL_LOG_FILE=${OSINTDEPINTEL_LOG_FILE:-/app/reports/osintdepintel.log}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AI_API_KEY=${AI_API_KEY:-}
      # Defaults to NVIDIA NIM; see ai_summary.py before changing provider.
      - AI_MODEL=${AI_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      - AI_BASE_URL=${AI_BASE_URL:-https://integrate.api.nvidia.com/v1/chat/completions}
    command: ["--config", "examples/targets.json", "--all", "--offline", "--output-dir", "reports"]
