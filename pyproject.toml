[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osintdepintel"
version = "0.2.0"
description = "Passive OSINT supply-chain dependency vulnerability intelligence CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["osint", "security", "supply-chain", "dependency", "vulnerability"]
authors = [
  {name = "osintdepintel contributors"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5.0", "mypy>=1.10.0", "pytest>=8.0.0", "pytest-cov>=5.0.0", "pre-commit>=3.0.0", "build>=1.0.0"]


[project.urls]
Homepage = "https://github.com/user/osintdepintel"
Documentation = "https://github.com/user/osintdepintel#readme"
Source = "https://github.com/user/osintdepintel"
Issues = "https://github.com/user/osintdepintel/issues"

[project.scripts]
osintdepintel = "osintdepintel.cli:main"

[tool.setuptools.packages.find]
include = ["osintdepintel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Tests"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=osintdepintel --cov-report=term-missing --cov-report=html -m 'not live'"
markers = [
    "live: marks tests that make live network calls (skipped by default; use -m live to run)",
    "e2e: marks end-to-end pipeline tests that exercise multiple components (skipped by default; use -m e2e to run)",
]

[tool.mypy]
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = ["__pycache__", ".mypy_cache", ".ruff_cache", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.coverage.run]
source = ["osintdepintel"]
omit = ["*/tests/*", "*/__pycache__/*"]
